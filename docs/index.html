<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gateway API — Interactive Route Explorer</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="https://noyitz.github.io/flowstory/templates/style.css">
  <style>
    .fs-panel { transition: transform .2s ease, background .3s, border-color .3s; }
    .fs-brand { gap: 8px; }
    .fs-brand img.gateway-api-logo { display: block; height: clamp(52px, 4.1vw, 79px); width: auto; max-width: 410px; object-fit: contain; }
    .fs-brand img.gateway-api-logo-light { display: none; }
    body.light .fs-brand .gateway-api-logo-dark { display: none; }
    body.light .fs-brand .gateway-api-logo-light { display: block; }
    .fs-flow-bar { gap: 8px; }
    #fs-flow-select { flex: 1 0 100%; width: 100%; min-width: 0; }
    .fs-flow-bar #fs-speed { flex: 0 0 70px; width: 70px; }
    .fs-flow-bar button { min-height: 36px; }
    #fs-panel-content { display: flex; min-height: 0; flex: 1; flex-direction: column; }
    #fs-steps, #fs-inspector { min-height: 0; }
    #fs-canvas { position: fixed; top: 0; left: 0; z-index: 0; display: block; }
    #fs-highlight-box { z-index: 250 !important; }
    #fs-overlay { z-index: 300 !important; }
    #fs-overlay-card {
      width: min(900px, calc(100vw - 400px)); max-width: none !important;
      max-height: calc(100vh - 20px); overflow: auto;
      background: var(--fs-bg-surface) !important; border-color: var(--fs-border) !important;
      box-shadow: 0 12px 40px rgba(0,0,0,.35) !important;
    }
    body.sidebar-collapsed #fs-overlay-card { width: min(900px, calc(100vw - 40px)); }
    #fs-overlay-desc, #fs-overlay-close { color: var(--fs-text-dim) !important; }
    #fs-overlay-details > div span:first-child { color: var(--fs-text-dim) !important; }
    #fs-overlay-details > div span:nth-child(2) { color: var(--fs-text) !important; }
    .fs-yaml {
      margin: 14px 0 0; padding: 18px; max-height: 56vh; overflow: auto;
      border: 1px solid var(--fs-border); border-radius: 6px;
      background: var(--fs-bg); color: var(--fs-text);
      font: 14px/1.55 SFMono-Regular, Consolas, monospace; white-space: pre;
    }
    :root {
      --fs-yaml-key:#79c0ff; --fs-yaml-string:#a5d6ff; --fs-yaml-kind:#d2a8ff;
      --fs-yaml-literal:#f0883e; --fs-yaml-comment:#8b949e;
    }
    body.light {
      --fs-yaml-key:#0550ae; --fs-yaml-string:#0a3069; --fs-yaml-kind:#6639ba;
      --fs-yaml-literal:#953800; --fs-yaml-comment:#57606a;
    }
    .fs-yaml-key { color:var(--fs-yaml-key); font-weight:600; }
    .fs-yaml-string { color:var(--fs-yaml-string); }
    .fs-yaml-kind { color:var(--fs-yaml-kind); font-weight:600; }
    .fs-yaml-literal { color:var(--fs-yaml-literal); font-weight:600; }
    .fs-yaml-comment, .fs-yaml-punctuation { color:var(--fs-yaml-comment); }
    #fs-panel-toggle {
      position:fixed; top:16px; right:396px; z-index:201; width:36px; height:36px;
      border:1px solid var(--fs-border); border-radius:8px;
      background:var(--fs-bg-surface); color:var(--fs-text); cursor:pointer; font-size:18px;
    }
    .fs-theme-toggle { right:438px; }
    body.sidebar-collapsed .fs-panel { transform:translateX(100%); }
    body.sidebar-collapsed #fs-panel-toggle { right:60px; }
    body.sidebar-collapsed .fs-theme-toggle { right:16px; }
    body.sidebar-collapsed .fs-title { right:0; }
    body.sidebar-collapsed #fs-overlay { right:0 !important; }
    #fs-error { margin:16px; color:var(--fs-error); font:13px/1.5 monospace; white-space:pre-wrap; }
    .fs-credit {
      position:fixed; left:16px; bottom:14px; z-index:260;
      display:inline-flex; align-items:center; gap:6px;
      padding:6px 10px; border:1px solid var(--fs-border); border-radius:999px;
      background:var(--fs-bg-surface); color:var(--fs-text-dim);
      font:600 11px/1 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      letter-spacing:.02em; text-decoration:none;
      box-shadow:0 4px 16px rgba(0,0,0,.18); backdrop-filter:blur(8px);
    }
    .fs-credit:hover { color:#58a6ff; border-color:#58a6ff; }
    body.light .fs-credit { box-shadow:0 4px 16px rgba(0,0,0,.08); }
  </style>
</head>
<body>
  <button class="fs-theme-toggle" id="fs-theme" type="button" aria-label="Toggle theme">&#9790;</button>
  <button id="fs-panel-toggle" type="button" aria-label="Hide sidebar" aria-expanded="true" title="Hide sidebar">&#8250;</button>
  <div class="fs-brand" id="fs-brand">
    <img class="gateway-api-logo gateway-api-logo-dark" src="images/gateway-api-logo-text-horizontal-dark.png" alt="Gateway API">
    <img class="gateway-api-logo gateway-api-logo-light" src="images/gateway-api-logo-text-horizontal.png" alt="Gateway API">
  </div>
  <div class="fs-title" id="fs-title"></div>
  <aside class="fs-panel" aria-label="Diagram controls and details">
    <div class="fs-flow-bar">
      <select id="fs-flow-select" aria-label="Select Gateway API diagram or workflow"></select>
      <button class="fs-start" id="fs-play" type="button">&#9654; Start</button>
      <select id="fs-speed" aria-label="Playback speed">
        <option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option>
      </select>
      <button id="fs-mode" type="button" aria-pressed="false" title="Loop this workflow or rotate through all workflows">&#8635; Loop selection</button>
      <button class="fs-reset" id="fs-reset" type="button">Reset</button>
    </div>
    <div id="fs-panel-content"></div>
  </aside>
  <div id="fs-canvas-host"></div>
  <div class="fs-legend" id="fs-legend"></div>
  <div id="fs-overlay-host"></div>
  <a class="fs-credit" href="https://noyitz.github.io/flowstory/" target="_blank" rel="noopener">Built with FlowStory</a>

  <script type="module">
    import { FlowStory } from 'https://noyitz.github.io/flowstory/src/index.js';

    const C = { request:'#58a6ff', response:'#3fb950', filter:'#f0883e', tls:'#d2a8ff', gateway:'#79c0ff', infra:'#8b949e', error:'#f85149' };
    const legend = [
      { label:'Request / connection', color:C.request }, { label:'Response', color:C.response },
      { label:'Route filter / decision', color:C.filter }, { label:'TLS-encrypted traffic', color:C.tls },
      { label:'Configuration reference', color:C.infra }
    ];
    const base = (id, label, nodes, tooltips, steps, inspector) => ({
      meta:{ title:'Gateway API', author:'Illustrative flows based on Gateway API documentation' },
      canvas:{ width:1250, height:900 }, nodes, tooltips,
      flows:{ [id]:{ label, steps } }, flowOrder:[id], defaultFlow:id, legend,
      inspector:inspector || { initialState:{ phase:'request', headers:[], body:[], cycleState:[] } }
    });
    const arrow = (text, from, to, color, num, edge={}) => ({ text, mode:'arrow', from, to, color, num, ...edge });
    const light = (text, target, badge='✓') => ({ text, mode:'lightup', target, badge });
    const tip = (title, description, yaml, details=[]) => ({ title, description, yaml, details });
    const concept = (title, description, details=[]) => ({ title, description, details });
    const line = (value, style='keep', id) => ({ value, style, id });
    const gatewayClassYaml = (name='example') => `apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: ${name}
spec:
  controllerName: example.net/gateway-controller`;
    const serviceYaml = ({ name, app, namespace='shop', port=8080, targetPort=port, protocol='TCP', portName='http' }) => `apiVersion: v1
kind: Service
metadata:
  name: ${name}
  namespace: ${namespace}
spec:
  selector:
    app: ${app}
  ports:
    - name: ${portName}
      protocol: ${protocol}
      port: ${port}
      targetPort: ${targetPort}`;
    const podYaml = ({ name, app, namespace='shop', ports=[{ name:'http', port:8080, protocol:'TCP' }] }) => `apiVersion: v1
kind: Pod
metadata:
  name: ${name}
  namespace: ${namespace}
  labels:
    app: ${app}
spec:
  containers:
    - name: ${app}
      image: example.invalid/${app}:1.0
      ports:
${ports.map(p => `        - name: ${p.name}\n          containerPort: ${p.port}\n          protocol: ${p.protocol}`).join('\n')}`;

    const diagrams = {
      'ingress-before': base('ingress-before', 'Ingress · before', {
        cluster:{ x:185,y:155,w:1030,h:680,type:'boundary',label:'Kubernetes cluster',color:C.infra,labelAlign:'left' },
        client:{ x:24,y:405,w:138,h:72,label:'Web client',sublabel:'outside the cluster',color:C.infra },
        ingressClass:{ x:245,y:225,w:190,h:76,label:'IngressClass',sublabel:'selects controller',color:C.infra,inner:true },
        ingress:{ x:480,y:225,w:210,h:88,label:'Ingress: shop',sublabel:'host + path + backend',color:C.filter,inner:true },
        controller:{ x:245,y:410,w:210,h:78,label:'Ingress controller',sublabel:'implementation data plane',color:C.gateway,inner:true },
        service:{ x:650,y:410,w:185,h:78,label:'Service: shop-svc',sublabel:'port 80 → 8080',color:C.request,inner:true },
        pod:{ x:960,y:410,w:180,h:78,label:'Application Pod',sublabel:'app: shop',color:C.request,inner:true }
      }, {
        client:concept('Web client','External HTTP client; not a Kubernetes resource.',[['Request','shop.example.com/shop/items']]),
        cluster:concept('Kubernetes cluster','Boundary for Kubernetes API resources and the illustrative in-cluster controller.'),
        ingressClass:tip('IngressClass','Selects the Ingress controller. The Ingress API has no portable Gateway-style Listener.',`apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: legacy-ingress
spec:
  controller: example.net/ingress-controller`,[['API','networking.k8s.io/v1']]),
        ingress:tip('Ingress','The old API places host, path, and backend selection on one resource. Its controller supplies the data plane.',`apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop
  namespace: shop
spec:
  ingressClassName: legacy-ingress
  rules:
    - host: shop.example.com
      http:
        paths:
          - path: /shop
            pathType: Prefix
            backend:
              service:
                name: shop-svc
                port:
                  number: 80`,[['Scope','HTTP / HTTPS'],['Mapping','Gateway + HTTPRoute']]),
        controller:concept('Ingress controller data plane','An implementation-specific proxy or load balancer handles traffic; this is not a standard Ingress API resource.'),
        service:tip('Service: shop-svc','The Ingress backend is a Kubernetes Service. It maps port 80 to the Pod target port.',serviceYaml({name:'shop-svc',app:'shop',port:80,targetPort:8080})),
        pod:tip('Application Pod','Illustrative backend Pod selected by the Service.',podYaml({name:'shop-pod',app:'shop',ports:[{name:'http',port:8080,protocol:'TCP'}]}))
      }, [
        light('IngressClass selects the controller implementation.','ingressClass'),
        light('Ingress holds the host, path, and Service backend in one API object.','ingress'),
        arrow('The client sends an HTTP request to the controller-provided entry point.','client','controller',C.request,1,{fromRight:true,toLeft:true}),
        arrow('The Ingress controller applies the host/path rule and forwards to the Service.','controller','service',C.request,2,{fromRight:true,toLeft:true}),
        arrow('The Service selects a matching application Pod.','service','pod',C.request,3,{fromRight:true,toLeft:true}),
        arrow('The Pod response returns through the Service.','pod','service',C.response,4,{fromLeft:true,toRight:true}),
        arrow('The controller relays the response to the client.','service','controller',C.response,5,{fromLeft:true,toRight:true}),
        arrow('The client receives the HTTP response.','controller','client',C.response,6,{fromLeft:true,toRight:true})
      ], { initialState:{phase:'request',headers:[line('GET /shop/items HTTP/1.1','keep','request'),line('Host: shop.example.com','keep','host')],body:[],cycleState:[]} }),

      'ingress-after': base('ingress-after','Ingress · after',{
        cluster:{x:185,y:155,w:1030,h:680,type:'boundary',label:'Kubernetes cluster',color:C.infra,labelAlign:'left'},
        client:{x:24,y:405,w:138,h:72,label:'Web client',sublabel:'outside the cluster',color:C.infra},
        gatewayClass:{x:230,y:225,w:190,h:76,label:'GatewayClass',sublabel:'selects controller',color:C.infra,inner:true},
        gateway:{x:475,y:390,w:190,h:82,label:'Gateway: shop-gw',sublabel:'listener: HTTP :80',color:C.gateway,inner:true},
        route:{x:475,y:570,w:220,h:80,label:'HTTPRoute: shop',sublabel:'backendRefs → shop-svc',color:C.request,inner:true},
        service:{x:790,y:390,w:175,h:78,label:'Service: shop-svc',sublabel:'port 80',color:C.request,inner:true},
        pod:{x:1030,y:390,w:160,h:78,label:'Application Pod',sublabel:'app: shop',color:C.request,inner:true}
      },{
        client:concept('Web client','External HTTP client; not a Kubernetes resource.'), cluster:concept('Kubernetes cluster','Gateway API resources and illustrative workload.'),
        gatewayClass:tip('GatewayClass','A cluster-scoped resource selects the Gateway controller.',gatewayClassYaml(),[['Scope','Cluster']]),
        gateway:tip('Gateway','The operator requests an entry point and declares a Listener. The implementation provisions the data plane.',`apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shop-gw
  namespace: shop
spec:
  gatewayClassName: example
  listeners:
    - name: web
      hostname: shop.example.com
      port: 80
      protocol: HTTP
      allowedRoutes:
        kinds:
          - kind: HTTPRoute`),
        route:tip('HTTPRoute','The Gateway API counterpart to the Ingress rule. It attaches via parentRefs and references the Service through backendRefs.',`apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shop
  namespace: shop
spec:
  parentRefs:
    - name: shop-gw
      sectionName: web
  hostnames:
    - shop.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /shop
      backendRefs:
        - name: shop-svc
          port: 80`,[['Ingress host/path','HTTPRoute hostnames + matches'],['Backend','Service via backendRefs']]),
        service:tip('Service: shop-svc','Gateway API can continue to use the existing Service backend.',serviceYaml({name:'shop-svc',app:'shop',port:80,targetPort:8080})),
        pod:tip('Application Pod','Illustrative backend Pod selected by the Service.',podYaml({name:'shop-pod',app:'shop',ports:[{name:'http',port:8080,protocol:'TCP'}]}))
      },[
        light('GatewayClass selects the controller implementation.','gatewayClass'),
        light('Gateway declares the HTTP entry point as a named Listener.','gateway','HTTP'),
        light('HTTPRoute attaches to that Listener and maps the same host/path to shop-svc.','route'),
        arrow('The same client request reaches the Gateway address.','client','gateway',C.request,1,{fromRight:true,toLeft:true}),
        arrow('The Gateway applies the attached HTTPRoute and forwards to the referenced Service.','gateway','service',C.request,2,{fromRight:true,toLeft:true}),
        arrow('The Service selects the application Pod.','service','pod',C.request,3,{fromRight:true,toLeft:true}),
        arrow('The Pod response returns through the Service.','pod','service',C.response,4,{fromLeft:true,toRight:true}),
        arrow('The Gateway relays the response to the client.','service','gateway',C.response,5,{fromLeft:true,toRight:true}),
        arrow('The client receives the response.','gateway','client',C.response,6,{fromLeft:true,toRight:true})
      ],{initialState:{phase:'request',headers:[line('GET /shop/items HTTP/1.1','keep','request'),line('Host: shop.example.com','keep','host')],body:[],cycleState:[]}}),

      'gateway-basics': base('gateway-basics','Gateway basics',{
        cluster:{x:185,y:155,w:1030,h:680,type:'boundary',label:'Kubernetes cluster',color:C.infra,labelAlign:'left'},
        client:{x:24,y:405,w:138,h:72,label:'Web client',sublabel:'outside the cluster',color:C.infra},
        gatewayClass:{x:230,y:230,w:195,h:78,label:'GatewayClass',sublabel:'one controller',color:C.infra,inner:true},
        gateway:{x:475,y:390,w:190,h:82,label:'Gateway',sublabel:'address + Listeners',color:C.gateway,inner:true},
        route:{x:475,y:570,w:220,h:80,label:'HTTPRoute',sublabel:'backendRefs → app-svc',color:C.request,inner:true},
        service:{x:790,y:390,w:175,h:78,label:'Service',sublabel:'backendRef target',color:C.request,inner:true},
        pod:{x:1030,y:390,w:160,h:78,label:'Pod',sublabel:'selected by Service',color:C.request,inner:true}
      },{
        client:concept('Web client','An external client sends traffic to a Gateway address.'),
        cluster:concept('Kubernetes cluster','Gateway API resources configure a controller-managed data plane; the boundary is explanatory.'),
        gatewayClass:tip('GatewayClass','A cluster-scoped resource identifies the controller that implements this class of Gateways.',gatewayClassYaml(),[['Role','Infrastructure provider / cluster operator']]),
        gateway:tip('Gateway','Requests an address and defines named Listeners. The controller provisions and reports the data plane.',`apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: web-gateway
  namespace: shop
spec:
  gatewayClassName: example
  listeners:
    - name: web
      hostname: app.example.com
      port: 80
      protocol: HTTP
      allowedRoutes:
        kinds:
          - kind: HTTPRoute`,[['Role','Cluster operator / application admin']]),
        route:tip('HTTPRoute','Application developers declare host/path matches and backend references. Routes attach only when a Listener permits them.',`apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app
  namespace: shop
spec:
  parentRefs:
    - name: web-gateway
      sectionName: web
  hostnames:
    - app.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: app-svc
          port: 8080`,[['Role','Application developer']]),
        service:tip('Service','The HTTPRoute references a Service backend.',serviceYaml({name:'app-svc',app:'app'})),
        pod:tip('Application Pod','The selected workload endpoint; a destination, not a Gateway API Route.',podYaml({name:'app-pod',app:'app'}))
      },[
        light('GatewayClass names the controller that implements this class.','gatewayClass'),
        light('Gateway requests infrastructure and declares its Listener contract.','gateway'),
        light('HTTPRoute attaches using parentRefs; allowedRoutes constrains attachment.','route'),
        arrow('A client request arrives at the Gateway Listener.','client','gateway',C.request,1,{fromRight:true,toLeft:true}),
        arrow('The Gateway applies the matching Route configuration and forwards to its backendRef.','gateway','service',C.request,2,{fromRight:true,toLeft:true}),
        arrow('The Service selects a Pod endpoint.','service','pod',C.request,3,{fromRight:true,toLeft:true}),
        arrow('The response travels back through the Service and Gateway.','pod','service',C.response,4,{fromLeft:true,toRight:true}),
        arrow('The Gateway relays the response to the client.','service','gateway',C.response,5,{fromLeft:true,toRight:true}),
        arrow('The client receives the response.','gateway','client',C.response,6,{fromLeft:true,toRight:true})
      ],{initialState:{phase:'request',headers:[line('GET / HTTP/1.1','keep','request'),line('Host: app.example.com','keep','host')],body:[],cycleState:[]}}),

      'http-match': base('http-match','HTTPRoute · host and path matching',{
        cluster:{x:185,y:155,w:1030,h:680,type:'boundary',label:'Kubernetes cluster',color:C.infra,labelAlign:'left'},
        client:{x:24,y:405,w:138,h:72,label:'Web client',sublabel:'shop.example.com',color:C.infra},
        gateway:{x:250,y:395,w:185,h:82,label:'Gateway: web',sublabel:'HTTP :80',color:C.gateway,inner:true},
        route:{x:485,y:235,w:230,h:86,label:'HTTPRoute: shop',sublabel:'backendRefs → shop-svc',color:C.request,inner:true},
        service:{x:735,y:395,w:185,h:78,label:'Service: shop-svc',sublabel:':8080',color:C.request,inner:true},
        pod:{x:1015,y:395,w:175,h:78,label:'Shop Pod',sublabel:'app: shop',color:C.request,inner:true}
      },{
        client:concept('Web client','Sends an HTTP request with a host and path.',[['Request','GET /shop/items']]),
        cluster:concept('Kubernetes cluster','Gateway and workload resources for this HTTP example.'),
        gateway:tip('Gateway','Its HTTP Listener accepts this hostname and permits HTTPRoute attachment.',`apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: web
  namespace: shop
spec:
  gatewayClassName: example
  listeners:
    - name: http
      hostname: shop.example.com
      port: 80
      protocol: HTTP
      allowedRoutes:
        kinds:
          - kind: HTTPRoute`),
        route:tip('HTTPRoute: shop','The Gateway intersects Route hostnames with Listener hostnames, then evaluates rule matches. The Route is configuration, not a network hop.',`apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shop
  namespace: shop
spec:
  parentRefs:
    - name: web
      sectionName: http
  hostnames:
    - shop.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /shop
      backendRefs:
        - name: shop-svc
          port: 8080`,[['Hostname','shop.example.com'],['Path','PathPrefix /shop']]),
        service:tip('Service: shop-svc','The matched HTTPRoute forwards traffic to this Service port.',serviceYaml({name:'shop-svc',app:'shop'})),
        pod:tip('Shop Pod','Illustrative Pod selected by shop-svc.',podYaml({name:'shop-pod',app:'shop'}))
      },[
        arrow('The client sends GET /shop/items with Host: shop.example.com.','client','gateway',C.request,1,{fromRight:true,toLeft:true}),
        light('The Gateway matches Listener hostname, then HTTPRoute hostname and PathPrefix.','route'),
        arrow('The programmed Gateway forwards the matching request to shop-svc.','gateway','service',C.request,2,{fromRight:true,toLeft:true}),
        arrow('The Service selects a Pod endpoint.','service','pod',C.request,3,{fromRight:true,toLeft:true}),
        arrow('The Pod returns an HTTP response.','pod','service',C.response,4,{fromLeft:true,toRight:true}),
        arrow('The response returns through the Gateway to the client.','service','gateway',C.response,5,{fromLeft:true,toRight:true}),
        arrow('The client receives the response.','gateway','client',C.response,6,{fromLeft:true,toRight:true})
      ],{initialState:{phase:'request',headers:[line('GET /shop/items HTTP/1.1','keep','request'),line('Host: shop.example.com','keep','host')],body:[],cycleState:[]}}),

      'http-filter-rewrite': base('http-filter-rewrite','HTTPRoute · headers + path rewrite',{
        cluster:{x:185,y:155,w:1030,h:680,type:'boundary',label:'Kubernetes cluster',color:C.infra,labelAlign:'left'},
        client:{x:24,y:415,w:138,h:72,label:'Web client',sublabel:'outside cluster',color:C.infra},
        gateway:{x:235,y:405,w:180,h:82,label:'Gateway: web',sublabel:'HTTP :80',color:C.gateway,inner:true},
        route:{x:470,y:230,w:240,h:88,label:'HTTPRoute: store',sublabel:'backendRefs → store-svc',color:C.request,inner:true},
        filter:{x:480,y:565,w:220,h:76,type:'plugin',label:'Inline HTTPRoute filters',sublabel:'add header · rewrite path',color:C.filter,inner:true},
        service:{x:760,y:405,w:175,h:78,label:'Service: store-svc',sublabel:':8080',color:C.request,inner:true},
        pod:{x:1020,y:405,w:170,h:78,label:'Store Pod',sublabel:'app: store',color:C.request,inner:true}
      },{
        client:concept('Web client','Sends the original path and request headers.'),
        cluster:concept('Kubernetes cluster','The filter is configured inline on HTTPRoute; it is not a separate resource.'),
        gateway:tip('Gateway','Receives HTTP and applies the attached Route configuration.',`apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: web
  namespace: shop
spec:
  gatewayClassName: example
  listeners:
    - name: http

        const dx = to.x + to.w / 2 - (from.x + from.w / 2);

        const fromT = Math.min(dx ? from.w / 2 / Math.abs(dx) : Infinity, dy ? from.h / 2 / Math.abs(dy) : Infinity);
        const toT = Math.min(dx ? to.w / 2 / Math.abs(dx) : Infinity, dy ? to.h / 2 / Math.abs(dy) : Infinity);
        return [
          { x:from.x + from.w / 2 + dx * fromT, y:from.y + from.h / 2 + dy * fromT },
          { x:to.x + to.w / 2 - dx * toT, y:to.y + to.h / 2 - dy * toT }
        ];
      };
      ctx.save();
      ctx.globalAlpha = .72;
      ctx.lineWidth = Math.max(1, engine.ts(1.5));

        const from = nodes[fromKey], to = nodes[toKey];

        const [start, end] = edge(from, to);

        ctx.moveTo(engine.tx(start.x), engine.ty(start.y));

      const backdrop = overlayHost.querySelector('#fs-overlay');
      if (!card || backdrop.style.display === 'none') return;
      const right = innerWidth - (sidebarCollapsed ? 0 : 380) - 10;
      const left = Number.parseFloat(card.style.left) || 10;
      const top = Number.parseFloat(card.style.top) || 10;
      card.style.left = `${Math.max(10,Math.min(left,right-card.offsetWidth))}px`;
      card.style.top = `${Math.max(10,Math.min(top,innerHeight-card.offsetHeight-10))}px`;
    }
    function nextChoice(key) {
      const index = choices.findIndex(choice => choice.key === key);
      return choices[(index + 1) % choices.length].key;
    }
    function scheduleNext(key) {
      clearRotation();
      if (playbackMode !== 'rotate') return;
      rotationTimer = setTimeout(() => {
        rotationTimer = null;
        if (playbackMode !== 'rotate' || activeKey !== key || activeViz?._overlay?.isOpen) return;
        const next = nextChoice(key);
        flowSelect.value = next;
        loadScenario(next);
      },1800);
    }
    function stopActive() {
      clearRotation();
      const previous = activeViz;
      activeViz = null;
      if (!previous) return;
      previous.closeOverlay();
      clearRotation();
      previous.reset();
      previous._engine.stop();
    }
    async function loadScenario(key) {
      const sequence = ++loadSequence;
      stopActive();
      if (!diagrams[key]) return;
      activeKey = key;
      flowSelect.value = key;
      playBtn.innerHTML = '&#9654; Start';
      const diagram = { ...diagrams[key], theme:isDark ? 'dark' : 'light' };
      const panel = makePanel();
      const canvas = makeCanvas();
      const overlay = makeOverlay();
      const viz = new FlowStory(canvas, {
        panelWidth:sidebarCollapsed ? 0 : 380,
        stepsContainer:panel.stepsContainer,
        inspectorTitle:panel.inspectorTitle,
        inspectorContent:panel.inspectorContent,
        overlay:overlay.overlay,
        overlayCard:overlay.overlayCard,
        overlayTitle:overlay.overlayTitle,
        overlayDesc:overlay.overlayDesc,
        overlayDetails:overlay.overlayDetails,
        overlayAccent:overlay.overlayAccent,
        overlayClose:overlay.overlayClose,
        overlayResume:overlay.overlayResume,
        highlightBox:overlay.highlightBox,
        brand:byId('fs-brand'), title:byId('fs-title'), legend:byId('fs-legend')
      });
      const workflowTitle = diagram.flows[key].label;
      viz._updateFlowLabel = () => {
        if (viz._titleEl) viz._titleEl.textContent = workflowTitle;
      };
      activeViz = viz;
      try {
        await viz.load(diagram);
        if (sequence !== loadSequence) {
          viz.reset();
          viz._engine.stop();
          return;
        }
        const draw = viz._engine.onDraw;
        viz._engine.onDraw = (ctx, state, engine) => {
          draw(ctx, state, engine);
          drawConfigLinks(ctx, engine, diagram.nodes, configLinks[key] || []);
        };
        viz.setSpeed(Number(speedSelect.value));
        viz.state.loopMode = playbackMode === 'loop';
        window.__flowstory = viz;

        const show = viz._overlay.show.bind(viz._overlay);
        viz._overlay.show = (...args) => {
          clearRotation();
          show(...args);
          const tooltip = args[2];
          if (tooltip?.yaml) {
            const code = document.createElement('pre');
            code.className = 'fs-yaml';
            code.innerHTML = highlightYaml(tooltip.yaml);
            overlay.overlayDetails.append(code);
          }
          updatePlayButton();
          requestAnimationFrame(fitOverlay);
        };
        const close = viz._overlay.close.bind(viz._overlay);
        viz._overlay.close = (...args) => {
          close(...args);
          updatePlayButton();
          const steps = viz.state.flows[viz.state.activeFlow] || [];
          if (playbackMode === 'rotate' && viz.state.stepIndex >= steps.length) scheduleNext(key);
        };
        viz._playback.onChange(event => {
          if (viz !== activeViz) return;
          if (event === 'play' || event === 'resume') playBtn.innerHTML = '&#9646;&#9646; Pause';
          if (event === 'pause' || event === 'reset') playBtn.innerHTML = '&#9654; Start';
          if (event === 'reset') {
            const steps = viz.state.flows[viz.state.activeFlow] || [];
            if (playbackMode === 'rotate' && viz.state.stepIndex >= steps.length) scheduleNext(key);
          }
        });
        viz.play();
      } catch (error) {
        if (sequence !== loadSequence) return;
        panel.stepsContainer.innerHTML = `<div id="fs-error">Could not load this diagram: ${escapeHtml(error.message)}</div>`;
        console.error('Gateway API diagram load error:', error);
      }
    }

    flowSelect.addEventListener('change', () => loadScenario(flowSelect.value));
    playBtn.addEventListener('click', () => {
      if (!activeViz) return;
      clearRotation();
      activeViz.play();
      updatePlayButton();
    });
    speedSelect.addEventListener('change', () => activeViz?.setSpeed(Number(speedSelect.value)));
    resetBtn.addEventListener('click', () => {
      clearRotation();
      activeViz?.reset();
      updatePlayButton();
    });
    modeBtn.addEventListener('click', () => {
      if (activeViz?._overlay?.isOpen) activeViz.closeOverlay();
      playbackMode = playbackMode === 'loop' ? 'rotate' : 'loop';
      modeBtn.textContent = playbackMode === 'loop' ? '↻ Loop selection' : '↻ Rotate all';
      modeBtn.setAttribute('aria-pressed',String(playbackMode === 'rotate'));
      modeBtn.title = playbackMode === 'loop'
        ? 'Loop the selected workflow; click to rotate through all workflows'
        : 'Rotate through every workflow; click to loop only the selected workflow';
      clearRotation();
      if (activeViz) {
        activeViz.reset();
        activeViz.state.loopMode = playbackMode === 'loop';
        activeViz.play();
      }
    });
    themeBtn.addEventListener('click', () => {
      if (!activeViz) return;
      activeViz.toggleTheme();
      isDark = !document.body.classList.contains('light');
      themeBtn.innerHTML = isDark ? '&#9790;' : '&#9788;';
      themeBtn.setAttribute('aria-label',isDark ? 'Switch to light theme' : 'Switch to dark theme');
    });
    sidebarBtn.addEventListener('click', () => {
      sidebarCollapsed = document.body.classList.toggle('sidebar-collapsed');
      sidebarBtn.innerHTML = sidebarCollapsed ? '&#8249;' : '&#8250;';
      sidebarBtn.setAttribute('aria-label',sidebarCollapsed ? 'Show sidebar' : 'Hide sidebar');
      sidebarBtn.setAttribute('title',sidebarCollapsed ? 'Show sidebar' : 'Hide sidebar');
      sidebarBtn.setAttribute('aria-expanded',String(!sidebarCollapsed));
      if (activeViz) {
        activeViz._engine.panelWidth = sidebarCollapsed ? 0 : 380;
        activeViz._engine.resize();
      }
      requestAnimationFrame(fitOverlay);
    });
    window.addEventListener('resize',fitOverlay);

    console.assert(Object.keys(diagrams).length === choices.length,'Every selectable workflow must have an inline diagram.');
    console.assert(choices.every(choice => diagrams[choice.key]?.flows?.[choice.key]),'Every workflow must have a matching FlowStory flow.');
    loadScenario('gateway-basics');
  </script>
</body>
</html>
